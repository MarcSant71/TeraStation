# TeraStation TS5800D - smartd configuration
# Monitors SMART health, pending/reallocated sectors, and drive temperatures.
# Logs alerts via syslog/journald and Debian smartd-runner without waking standby disks.
DEVICESCAN -a -o on -S on -d removable -n standby,q -W 4,45,50 -m root -M exec /usr/share/smartmontools/smartd-runner
